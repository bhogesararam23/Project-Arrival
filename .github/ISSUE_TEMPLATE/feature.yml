name: Feature proposal
description: Propose a scoped, testable product or engineering change.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define observable outcomes and tests.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks, data and provider dependencies
    validations:
      required: false
