[package]
name = "arrival_ingestion"
version = "0.1.0"
edition = "2021"
description = "Project Arrival - High-throughput ingestion, license verification, and normalization pipeline"
authors = ["Project Arrival Engineering"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "arrival_ingest"
path = "src/main.rs"
